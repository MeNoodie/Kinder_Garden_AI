# Required GitHub repository secrets:
# AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, EC2_HOST, EC2_USER, EC2_SSH_KEY
# APP_ENV_FILE is optional and should contain the backend's KEY=value settings.
# The EC2 instance needs an instance profile that can pull from this ECR repository.
name: Deploy backend to EC2

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "main.py"
      - "pyproject.toml"
      - "README.md"
      - "backend/**"
      - "tests/**"
      - ".github/workflows/deploy.yaml"
  workflow_dispatch:

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: kinder_garden
  CONTAINER_NAME: kinder-garden-api
  APP_PORT: "8000"

jobs:
  build-and-push:
    name: Build, smoke-test, and push backend image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, smoke-test, and push backend image
        id: build
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker build --file Dockerfile --tag "$IMAGE" --tag "${REGISTRY}/${ECR_REPOSITORY}:latest" .
          docker run --detach --name kinder-garden-smoke --publish 8000:8000 "$IMAGE"
          trap 'docker rm --force kinder-garden-smoke >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              echo "Backend health check passed."
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              docker logs kinder-garden-smoke
              echo "Backend health check failed."
              exit 1
            fi
            sleep 3
          done

          docker push "$IMAGE"
          docker push "${REGISTRY}/${ECR_REPOSITORY}:latest"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy backend to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          AWS_REGION: ${{ env.AWS_REGION }}
          APP_PORT: ${{ env.APP_PORT }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          ENV_FILE_CONTENT: ${{ secrets.APP_ENV_FILE }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,AWS_REGION,APP_PORT,CONTAINER_NAME,ENV_FILE_CONTENT
          script: |
            set -euo pipefail

            if ! command -v docker >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y docker.io
            fi
            if ! command -v aws >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y unzip curl
              cd /tmp
              curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
              rm -rf aws
              unzip -q awscliv2.zip
              sudo ./aws/install
              aws --version
            fi
            if ! command -v curl >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y curl
            fi
            sudo systemctl enable --now docker

            printf '%s' "$ENV_FILE_CONTENT" > "$HOME/.kinder-garden-ai.env"
            chmod 600 "$HOME/.kinder-garden-ai.env"

            REGISTRY="${IMAGE%%/*}"
            aws ecr get-login-password --region "$AWS_REGION" \
              | sudo docker login --username AWS --password-stdin "$REGISTRY"
            sudo docker pull "$IMAGE"

            sudo docker rm --force "$CONTAINER_NAME" 2>/dev/null || true
            sudo docker run --detach \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              --publish "${APP_PORT}:8000" \
              --env-file "$HOME/.kinder-garden-ai.env" \
              "$IMAGE"

            for attempt in $(seq 1 20); do
              if curl --fail --silent "http://127.0.0.1:${APP_PORT}/health"; then
                echo "Deployment healthy: $IMAGE"
                exit 0
              fi
              sleep 3
            done

            sudo docker logs "$CONTAINER_NAME"
            echo "Deployment health check failed."
            exit 1